apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  workspaces:
    - name: pipeline-workspace
  params:
    - name: repo-url
      type: string
      description: The git repository URL to clone from
      default: "https://github.com/1241007/ci-cd-final-project.git"
    - name: branch
      type: string
      description: The git branch to clone
      default: "main"
    - name: build-image
      type: string
      description: The docker image to build and push
      default: "image-registry.openshift-image-registry.svc:5000/dnyaneshh18-dev/products:latest"
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: git-clone
      taskRef:
        name: git-clone
      runAfter:
        - cleanup
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.branch)
      workspaces:
        - name: output
          workspace: pipeline-workspace

    - name: flake8
      taskRef:
        name: flake8
      runAfter:
        - git-clone
      params:
        - name: image
          value: python:3.9-slim
        - name: args
          value: "service tests"
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: nose
      taskRef:
        name: nose
      runAfter:
        - flake8
      params:
        - name: args
          value: "-v"
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: buildah
      taskRef:
        name: buildah
      runAfter:
        - nose
      params:
        - name: IMAGE
          value: $(params.build-image)
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: deploy
      taskRef:
        name: openshift-client
      runAfter:
        - buildah
      params:
        - name: SCRIPT
          value: |
            oc apply -f deploy/
            oc rollout status deployment/products
      workspaces:
        - name: manifest-dir
          workspace: pipeline-workspace
